name: diario-cultural

on:
  schedule:
    - cron: "0 10 * * *"   # 07h de Brasília
    - cron: "0 15 * * *"   # 12h de Brasília
    - cron: "0 21 * * *"   # 18h de Brasília
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: diario-cultural
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      PAGES_URL: ${{ secrets.PAGES_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Gerar post
        run: python bot/main.py gerar

      - name: Publicar no GitHub Pages
        if: always()
        run: |
          git config user.name "diario-cultural-bot"
          git config user.email "diario-cultural-bot@users.noreply.github.com"
          git add bot docs
          git diff --cached --quiet || (git commit -m "post do diário cultural" && git push)

      - name: Esperar o Pages atualizar
        run: sleep 120

      - name: Enviar ao Telegram
        run: python bot/main.py enviar

      - name: Salvar diagnóstico
        if: always()
        run: |
          git add bot
          git diff --cached --quiet || (git commit -m "diagnóstico" && git pull --rebase && git push)
