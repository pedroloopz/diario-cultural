name: descobrir-ids

# Rode à mão, logo depois de mandar uma mensagem em cada tópico do grupo.
# Mostra o chat_id do grupo e o message_thread_id de cada tópico (nunca o texto das mensagens).
on:
  workflow_dispatch:

jobs:
  ids:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Descobrir IDs
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 descobrir_ids.py
